name: Publicar Guia Comercial no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditar dependências
        run: npm audit --audit-level=high

      - name: Verificar código
        run: npm run lint

      - name: Verificar tipos
        run: npm run typecheck

      - name: Compilar aplicação
        run: npm run build

      - name: Executar testes de contrato
        run: SITES_TEST_SKIP_BUILD=1 npm test

      - name: Executar testes de ponta a ponta
        run: npm run test:e2e

      - name: Gerar versão pública
        run: npm run build:github

      - name: Preparar artefato do Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist-pages

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
