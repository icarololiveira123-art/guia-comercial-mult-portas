name: Recorta Planta para Windows

on:
  push:
    branches: [main, feat/recorta-planta-download]
    paths:
      - 'desktop-recorta-planta/**'
      - '.github/workflows/recorta-planta-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recorta-planta-windows
  cancel-in-progress: false

jobs:
  windows:
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop-recorta-planta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop-recorta-planta/package-lock.json
      - name: Instalar dependências fixadas
        run: npm ci --no-fund
      - name: Preparar o aplicativo offline
        run: npm run prepare:web
      - name: Testar os arquivos locais
        run: npm test
      - name: Testar leitura, OCR, ajustes e download no Windows
        run: npm run test:interface
      - name: Gerar executável portátil
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Abrir o executável no Windows
        shell: pwsh
        run: ./tests/smoke-windows.ps1
      - name: Registrar integridade
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'release/Recorta-Planta-Windows.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Recorta-Planta-Windows.exe" | Out-File release/SHA256.txt -Encoding utf8
      - name: Guardar o executável verificado
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Recorta-Planta-Windows-1.0.1
          if-no-files-found: error
          path: |
            desktop-recorta-planta/release/Recorta-Planta-Windows.exe
            desktop-recorta-planta/release/SHA256.txt
      - name: Guardar os resultados da verificação
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Recorta-Planta-Windows-1.0.1-QA
          path: desktop-recorta-planta/test-results/native-smoke-report.json

  release:
    needs: windows
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar somente o executável aprovado
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Recorta-Planta-Windows-1.0.1
          path: release
      - name: Conferir integridade do executável
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          read -r expected filename < SHA256.txt
          filename=${filename%$'\r'}
          [[ "$expected" =~ ^[0-9a-f]{64}$ && "$filename" == 'Recorta-Planta-Windows.exe' ]]
          actual=$(sha256sum -- 'Recorta-Planta-Windows.exe')
          [[ "${actual%% *}" == "$expected" ]]
      - name: Disponibilizar download no site
        working-directory: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create recorta-planta-v1.0.1 'Recorta-Planta-Windows.exe' 'SHA256.txt' --repo "$GH_REPO" --target "$RELEASE_COMMIT" --title 'Recorta Planta para Windows 1.0.1' --notes 'Aplicativo portátil para Windows 10/11 de 64 bits. Atualização de segurança do leitor de PDF. Identifica plantas baixas em PDFs digitais e escaneados, permite ajustar o recorte e salva um novo PDF. Todos os componentes estão incluídos para uso offline. Confira o enquadramento antes de baixar. Disponível em Ferramentas de trabalho no Guia Comercial Mult Portas.'
