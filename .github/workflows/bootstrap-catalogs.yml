name: Recuperar catalogos iniciais
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-catalogs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalogos:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Baixar catalogos oficiais
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/catalogos
          base="https://guia-comercial-mult-portas.eletrovale-cont.chatgpt.site/catalogos"
          for name in \
            brimak-catalogo-2018.pdf \
            brimak-linha-elite.pdf \
            brimak-linha-l25.pdf \
            brimak-linha-super-25.pdf \
            brimak-portas-janelas-pvc.pdf
          do
            curl --fail --location --retry 3 --output "public/catalogos/$name" "$base/$name"
          done
          sha256sum --check <<'CHECKSUMS'
          06f0d758205e8f821c75471a97d23385166ef1f3fec5e657bcb913eda7e2f23d  public/catalogos/brimak-catalogo-2018.pdf
          79d3090673836783a479d8f99fbe7be72d1f4ba766b0acff04ae7fe865a13eb5  public/catalogos/brimak-linha-elite.pdf
          5fc60efe1b9f62ea74c0c68ba697082d240edba97357336f1133941ac113fd04  public/catalogos/brimak-linha-l25.pdf
          ad9a17296eafbf796653a23280ef079c9d237cbb996b0fc95fd43eeef9ccf3e0  public/catalogos/brimak-linha-super-25.pdf
          a873a769c972a865ef402faa0522f82c60a5c389908fd0a635ba90c125993795  public/catalogos/brimak-portas-janelas-pvc.pdf
          CHECKSUMS

      - name: Registrar catalogos
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/catalogos
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add catalog PDFs"
          git push
